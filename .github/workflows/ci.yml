name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - pytest
    runs-on: ubuntu-latest
    env:
      AI_MODE: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Chạy kiểm thử tự động
        run: pytest --junitxml=pytest-report.xml

      - name: Đánh giá chatbot trên bộ 40 câu hỏi
        env:
          DATABASE_URL: sqlite:///civicbot_eval.db
        run: |
          python import_docx.py --all
          python scripts/evaluate_chatbot.py --output eval-report.csv

      - name: Lưu báo cáo kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            pytest-report.xml
            eval-report.csv

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  docker:
    name: Docker - build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend + frontend image
        run: |
          cp .env.example .env
          docker compose build
